name: astrbot_plugin_countdown
display_name: 倒数日
short_desc: 事件倒计时与正计时记录，支持图片卡片、每日汇总、到点提醒和自然语言管理
desc: >-
  面向群聊和私聊的事件提醒与时间记录插件，适用于活动前瞻、报名截止、开服及建群天数等场景。
  支持未来事件倒计时、过去日期正计时、自定义文案、图片卡片查询和每日定时汇总；带时刻事件可提前提醒并在到点时提醒。
  各会话的任务独立保存，各群可单独设置汇总时间，支持管理权限配置和到期自动清理。
  可通过指令或 LLM 自然语言添加、查询、修改、停用及删除任务，操作遵循插件权限配置。
  当前仅支持 aiocqhttp（OneBot v11）。
version: v1.4.4
author: cnflwzh
repo: https://github.com/cnflwzh/astrbot_plugin_countdown
tags:
  - 生活
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.0.0"
